<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Abhinav Sahu, full-stack developer and AI product builder</title>
  <desc id="desc">A cinematic command-interface banner with crimson signal graphics.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#080b10"/><stop offset="0.54" stop-color="#0d1117"/><stop offset="1" stop-color="#151018"/></linearGradient>
    <radialGradient id="moon" cx="42%" cy="40%" r="60%"><stop offset="0" stop-color="#f05763"/><stop offset="0.45" stop-color="#c51f39"/><stop offset="1" stop-color="#580c1b"/></radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#c9d1d9" stroke-opacity=".055"/></pattern>
    <filter id="noise" x="-20%" y="-20%" width="140%" height="140%"><feTurbulence baseFrequency=".7" numOctaves="2" seed="23" type="fractalNoise" result="n"/><feColorMatrix in="n" type="saturate" values="0" result="g"/><feBlend in="SourceGraphic" in2="g" mode="soft-light"/></filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="frame"><rect x="24" y="24" width="1152" height="392" rx="2"/></clipPath>
    <style>.sans{font-family:Inter,Segoe UI,Arial,sans-serif}.mono{font-family:JetBrains Mono,SFMono-Regular,Consolas,monospace}.scan{animation:scan 5.5s cubic-bezier(.16,1,.3,1) infinite}.pulse{animation:pulse 2.8s cubic-bezier(.65,0,.35,1) infinite}.dash{stroke-dasharray:8 12;animation:dash 18s linear infinite}@keyframes scan{0%,12%{transform:translateY(-70px);opacity:0}25%,72%{opacity:.42}90%,100%{transform:translateY(520px);opacity:0}}@keyframes pulse{0%,100%{opacity:.4;transform:scale(.94)}50%{opacity:1;transform:scale(1.05)}}@keyframes dash{to{stroke-dashoffset:-400}}@media(prefers-reduced-motion:reduce){.scan,.pulse,.dash{animation:none}}</style>
  </defs>
  <rect width="1200" height="440" fill="url(#bg)"/><rect width="1200" height="440" fill="url(#grid)"/>
  <g clip-path="url(#frame)" filter="url(#noise)"><path d="M-20 385 430 -32M95 470 575 -15M805 455 1218 82" stroke="#e63946" stroke-opacity=".10" stroke-width="1"/><circle cx="920" cy="198" r="136" fill="url(#moon)" opacity=".92"/><circle cx="920" cy="198" r="166" fill="none" stroke="#e63946" stroke-opacity=".22" class="dash"/><circle cx="920" cy="198" r="194" fill="none" stroke="#c9d1d9" stroke-opacity=".10" stroke-dasharray="2 14"/><path d="M702 198h436M920-20v436" stroke="#f1faee" stroke-opacity=".09"/><g fill="none" stroke="#f1faee" stroke-opacity=".32"><path d="M888 198h64M920 166v64"/><circle cx="920" cy="198" r="18"/></g><rect x="0" y="0" width="1200" height="56" fill="#e63946" opacity=".12" class="scan"/></g>
  <g class="sans"><text x="72" y="80" fill="#8b949e" font-size="14" font-weight="700" letter-spacing="3">PROFILE // SIGNAL 2312307</text><text x="72" y="210" fill="#f1faee" font-size="76" font-weight="900" letter-spacing="-2">ABHINAV</text><text x="72" y="284" fill="#e63946" font-size="76" font-weight="900" letter-spacing="-2">SAHU</text><text x="76" y="328" fill="#c9d1d9" font-size="18" font-weight="600" letter-spacing="2">FULL-STACK SYSTEMS · AI PRODUCTS · FIELD-TESTED BUILDS</text></g>
  <g class="mono" font-size="12" fill="#8b949e"><text x="75" y="380">KANPUR, IN  //  UTC+05:30  //  STATUS: BUILDING</text><text x="1000" y="388">EST. 2024</text></g>
  <g fill="#e63946" class="pulse" transform-origin="1100px 69px" filter="url(#glow)"><circle cx="1100" cy="69" r="5"/><circle cx="1100" cy="69" r="14" fill="none" stroke="#e63946" stroke-width="1"/></g>
  <path d="M24 68V24h44M1132 24h44v44M24 372v44h44M1132 416h44v-44" fill="none" stroke="#c9d1d9" stroke-opacity=".42" stroke-width="2"/><rect x="24" y="24" width="1152" height="392" fill="none" stroke="#30363d"/><rect x="24" y="405" width="438" height="11" fill="#e63946"/><rect x="470" y="405" width="54" height="11" fill="#ff6b35"/>
</svg>
