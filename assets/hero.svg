<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">Abhinav Sahu, builder beyond the walls</title>
  <desc id="desc">A dark fantasy military dossier banner with crimson eclipse, gilded sigils, and a branching fate motif.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090a0c"/><stop offset=".58" stop-color="#171316"/><stop offset="1" stop-color="#2b0d16"/></linearGradient>
    <radialGradient id="eclipse" cx="44%" cy="42%" r="62%"><stop stop-color="#ef4b52"/><stop offset=".42" stop-color="#a4142e"/><stop offset="1" stop-color="#3a0715"/></radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f2d58a"/><stop offset=".5" stop-color="#b78a3f"/><stop offset="1" stop-color="#6d4c24"/></linearGradient>
    <pattern id="paper" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#e5d7b2" stroke-opacity=".045"/><circle cx="7" cy="12" r=".7" fill="#f1e7cc" opacity=".12"/></pattern>
    <filter id="grain"><feTurbulence baseFrequency=".62" numOctaves="2" seed="19" result="n"/><feColorMatrix in="n" type="saturate" values="0"/><feBlend in="SourceGraphic" mode="soft-light"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="window"><rect x="22" y="22" width="1156" height="416" rx="3"/></clipPath>
    <style>.serif{font-family:Georgia,'Times New Roman',serif}.sans{font-family:Inter,'Segoe UI',Arial,sans-serif}.mono{font-family:'Courier New',monospace}.orbit{transform-origin:920px 205px;animation:orbit 22s linear infinite}.flare{animation:flare 3.8s ease-in-out infinite}.fog{animation:fog 9s ease-in-out infinite alternate}.rune{animation:rune 4.2s steps(2,end) infinite}@keyframes orbit{to{transform:rotate(360deg)}}@keyframes flare{0%,100%{opacity:.4;transform:scale(.9)}50%{opacity:1;transform:scale(1.08)}}@keyframes fog{from{transform:translateX(-18px);opacity:.15}to{transform:translateX(18px);opacity:.32}}@keyframes rune{0%,72%{opacity:.32}76%,86%{opacity:.95}90%,100%{opacity:.32}}@media(prefers-reduced-motion:reduce){.orbit,.flare,.fog,.rune{animation:none}}</style>
  </defs>
  <rect width="1200" height="460" fill="url(#sky)"/><rect width="1200" height="460" fill="url(#paper)"/>
  <g clip-path="url(#window)" filter="url(#grain)"><path d="M-50 420 440 -20M120 470 610 -15M710 470 1230 18" stroke="#b31332" stroke-opacity=".18"/><path d="M0 355 C170 305 260 370 420 338S690 305 830 350s250 8 430-42v152H0z" fill="#07080a" opacity=".72" class="fog"/><path d="M0 386 C160 344 280 397 430 365s265-26 403 12 240 8 367-25v86H0z" fill="#0a0a0b" opacity=".88"/><circle cx="920" cy="205" r="132" fill="url(#eclipse)" opacity=".9"/><circle cx="920" cy="205" r="164" fill="none" stroke="#c89443" stroke-opacity=".42" stroke-width="1" stroke-dasharray="4 14" class="orbit"/><circle cx="920" cy="205" r="198" fill="none" stroke="#e63946" stroke-opacity=".23" stroke-width="1" stroke-dasharray="10 20"/><path d="M675 205h490M920-40v490" stroke="#f5e8c9" stroke-opacity=".08"/><g fill="none" stroke="url(#gold)" stroke-width="1.2" opacity=".72"><path d="M920 42l20 47 51 5-39 33 12 50-44-27-44 27 12-50-39-33 51-5z"/><path d="M920 156v98M871 205h98"/></g><g fill="none" stroke="#d9bd79" stroke-opacity=".44" class="rune"><path d="M1005 120l24 10-14 22 29 8-17 18 21 17-29 4 4 28-25-13-14 25-13-26-28 12 5-27-28-5 21-17-16-18 29-7-13-23 28 9 13-25 14 23z"/><circle cx="920" cy="205" r="27"/></g><path d="M0 61h1200" stroke="#d0b477" stroke-opacity=".17"/><rect x="0" y="0" width="1200" height="42" fill="#8e182a" opacity=".15"/></g>
  <g class="sans"><text x="72" y="83" fill="#d9bd79" font-size="13" font-weight="700" letter-spacing="4">THE RECORDS OF THE OUTER WALL // 2312307</text><text x="72" y="216" fill="#f4ead4" font-size="78" font-weight="900" letter-spacing="-3">ABHINAV</text><text x="72" y="292" fill="#e63946" font-size="78" font-weight="900" letter-spacing="-3">SAHU</text><text x="77" y="337" fill="#d8cfbf" font-size="17" font-weight="700" letter-spacing="2.4">ENGINEER OF SYSTEMS · SEEKER OF HIDDEN PATHS</text></g>
  <g class="mono" font-size="12" fill="#9b9182"><text x="76" y="396">KANPUR, INDIA  //  THE BUILDING ARC  //  OATH: MAKE IT USEFUL</text><text x="1024" y="398">VOL. 01</text></g>
  <g class="flare" transform-origin="1100px 72px" filter="url(#glow)" fill="#e63946"><circle cx="1100" cy="72" r="5"/><circle cx="1100" cy="72" r="15" fill="none" stroke="#e63946" stroke-width="1"/></g><path d="M22 72V22h50M1128 22h50v50M22 388v50h50M1128 438h50v-50" fill="none" stroke="#d9bd79" stroke-opacity=".52" stroke-width="2"/><rect x="22" y="22" width="1156" height="416" fill="none" stroke="#51453d" stroke-width="1"/><rect x="22" y="425" width="430" height="13" fill="#e63946"/><rect x="462" y="425" width="55" height="13" fill="#d9bd79"/>
</svg>
