<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">Abhinav Sahu campaign records</title>
  <desc id="desc">A reliable local GitHub profile telemetry panel showing public repositories, followers, projects, and a contribution-style activity field.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a0b0e"/><stop offset=".62" stop-color="#171216"/><stop offset="1" stop-color="#270b14"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#d9bd79" stroke-opacity=".035"/></pattern>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#e63946"/><stop offset=".7" stop-color="#d9bd79"/><stop offset="1" stop-color="#e63946"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>.m{font-family:'Courier New',monospace}.s{font-family:Inter,'Segoe UI',Arial,sans-serif}.pulse{animation:p 3s ease-in-out infinite}.flow{stroke-dasharray:5 13;animation:f 16s linear infinite}@keyframes p{0%,100%{opacity:.45}50%{opacity:1}}@keyframes f{to{stroke-dashoffset:-360}}@media(prefers-reduced-motion:reduce){.pulse,.flow{animation:none}}</style>
  </defs>
  <rect width="1200" height="390" rx="8" fill="url(#bg)"/><rect width="1200" height="390" rx="8" fill="url(#grid)"/><rect x="1" y="1" width="1198" height="388" rx="7" fill="none" stroke="#4d3d3a"/>
  <path d="M0 58h1200" stroke="#4d3d3a"/><circle cx="32" cy="29" r="5" fill="#e63946"/><circle cx="52" cy="29" r="5" fill="#d9bd79"/><circle cx="72" cy="29" r="5" fill="#8b8179"/><text x="102" y="34" class="m" fill="#9c9187" font-size="13">/archives/campaign-records</text><text x="1076" y="34" class="m" fill="#d9bd79" font-size="12">LOCAL</text>
  <g class="s"><text x="36" y="94" fill="#d9bd79" font-size="12" font-weight="700" letter-spacing="3">FIELD TELEMETRY</text><text x="36" y="126" fill="#f3ead8" font-size="24" font-weight="800">The work leaves a trace.</text></g>
  <g class="m"><text x="36" y="170" fill="#9c9187" font-size="12">PUBLIC REPOSITORIES</text><text x="36" y="212" fill="#e63946" font-size="40" font-weight="700">32</text><text x="36" y="236" fill="#9c9187" font-size="11">visible systems</text><text x="222" y="170" fill="#9c9187" font-size="12">FOLLOWERS</text><text x="222" y="212" fill="#d9bd79" font-size="40" font-weight="700">18</text><text x="222" y="236" fill="#9c9187" font-size="11">crew members</text><text x="408" y="170" fill="#9c9187" font-size="12">ACTIVE BUILDS</text><text x="408" y="212" fill="#ff6b35" font-size="40" font-weight="700">04</text><text x="408" y="236" fill="#9c9187" font-size="11">selected artifacts</text></g>
  <g transform="translate(650 92)"><text class="m" x="0" y="0" fill="#9c9187" font-size="12">CONTRIBUTION FIELD // RECENT SIGNAL</text><rect x="0" y="23" width="500" height="172" rx="4" fill="#0b0c0f" stroke="#3b3031"/><path d="M0 195h500M0 152h500M0 109h500M0 66h500M0 23h500" stroke="#d9bd79" stroke-opacity=".08"/><path d="M0 176 C38 160 57 176 88 139S134 152 170 121s40 19 77-15 52 21 88-21 51 22 90-10 53 8 75-24" fill="none" stroke="url(#line)" stroke-width="2" class="flow" filter="url(#glow)"/><path d="M0 176 C38 160 57 176 88 139S134 152 170 121s40 19 77-15 52 21 88-21 51 22 90-10 53 8 75-24" fill="none" stroke="#e63946" stroke-opacity=".25" stroke-width="9" class="pulse"/><g fill="#d9bd79" opacity=".9"><circle cx="88" cy="139" r="3"/><circle cx="170" cy="121" r="3"/><circle cx="257" cy="106" r="3"/><circle cx="335" cy="85" r="3"/><circle cx="425" cy="75" r="3"/></g><text x="0" y="218" class="m" fill="#6f6663" font-size="10">START</text><text x="462" y="218" class="m" fill="#6f6663" font-size="10">NOW</text></g>
  <path d="M36 330h1114" stroke="#4d3d3a"/><text x="36" y="357" class="m" fill="#d9bd79" font-size="12">STATUS: BUILDING</text><text x="1060" y="357" class="m" fill="#9c9187" font-size="12">VOL. 01</text>
</svg>
